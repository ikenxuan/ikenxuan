name: Build profile card

on:
  push:
    branches: [main]
    # The bot's own commit touches only these two files. Without this, that
    # commit would trigger another build -- which would produce identical output
    # and commit nothing, so the loop dies out, but ignoring the paths means the
    # run never starts. Cheaper and clearer than a guard on github.actor, which
    # would also have to not block the schedule.
    paths-ignore:
      - profile.svg
      - cache/stats.json
  schedule:
    # 04:17 UTC daily. Deliberately not on the hour: GitHub queues every job that
    # asks for :00 at the same instant, and a run scheduled there can sit for
    # many minutes before a runner picks it up.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python: uv reads .python-version and fetches that exact
      # interpreter itself, so the CI Python is the same one used locally.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked, not --frozen: --frozen silently uses uv.lock as-is, --locked
        # additionally fails when pyproject.toml and uv.lock disagree. That is
        # the check worth having -- it catches a dependency edited without
        # re-locking, which --frozen would happily paper over.
        run: uv sync --locked

      # This step reaches the network twice: github.com/{user}.png for the
      # portrait and api.github.com for the stats. Both are cached under cache/,
      # which is not committed, so a fresh checkout needs both to succeed. If the
      # avatar CDN has a bad minute the step fails rather than rendering a card
      # with no face on it.
      #
      # ACCESS_TOKEN (a personal token with read:user) is what the stats call
      # needs. The default GITHUB_TOKEN is an installation token for this one
      # repository: asking it for the account's repositories returns only the
      # repos it can see, with HTTP 200 and no error, which would write wrong
      # numbers onto the card. It is kept as a fallback so the job still runs
      # before the secret exists -- stats.collect rejects the partial result and
      # keeps the cached figures instead.
      - name: Generate profile.svg
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: uv run --locked python -m generator.main

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg cache/stats.json
          git diff --staged --quiet || git commit -m "chore: rebuild profile card"
          git push
